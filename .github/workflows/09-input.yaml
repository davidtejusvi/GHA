name: 08 - OIDC

on:
  workflow_dispatch:
    input:
      bucket-name:
        description: "Enter bucket name you want to create"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  list-buckets:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ARN_ROLE }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: create S3 buckets using OIDC
        run: |
          aws s3 mb s3://${{ github.event.inputs.bucket-name}} --region ${{secrets.AWS_REGION}}
          aws s3 ls
